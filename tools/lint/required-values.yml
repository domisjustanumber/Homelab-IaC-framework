---
# Runs the required-value assertions of one role (framework NTK9 rule 4).
# tools/lint/check_roles.py starts it with an empty inventory.
- name: Run the required-value assertions of one role
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the assertions
      ansible.builtin.include_role:
        name: "{{ role_under_test }}"
        tasks_from: assert
