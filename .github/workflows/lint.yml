---
name: Lint

"on":
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# All checks run in the lint image (ADR-E7ZX). The FROM line of tools/lint/Dockerfile is the one
# Python version that gates a merge, so this workflow sets no python-version and no uv.
jobs:
  checks:
    name: All checks in the lint image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the lint image
        run: |
          IMAGE=$(sh tools/lint/image-tag.sh .)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f tools/lint/Dockerfile -t "$IMAGE" .
      - name: yamllint, shellcheck, doc checks, ansible-lint and role checks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$IMAGE" sh tools/lint/ci.sh
