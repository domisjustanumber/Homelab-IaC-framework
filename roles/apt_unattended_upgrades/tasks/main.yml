---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Install 20auto-upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Install 50unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Create apt-daily-upgrade.timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: updates_upgrade_time | length > 0

# See ADR-EQ0Z (decisions/EQ0Z-unattended-upgrades-and-reboots.md).
- name: Install apt-daily-upgrade.timer drop-in
  ansible.builtin.template:
    src: apt-daily-upgrade-override.conf.j2
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  when: updates_upgrade_time | length > 0
  notify: Reload systemd for apt timer

- name: Remove apt-daily-upgrade.timer drop-in when no upgrade time is set
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    state: absent
  when: updates_upgrade_time | length == 0
  notify: Reload systemd for apt timer
