# The dev tools: the doc checks, yamllint and shellcheck, which run from the uv venv (ADR-NXK2).
# The ansible group pins Ansible once. The lint image and CI install it from uv.lock. A plain
# `uv sync` does not install it, because Ansible does not run on Windows.
[project]
name = "homelab-framework"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "pre-commit==4.6.2", "yamllint==1.38.0", "shellcheck-py==0.11.0.1"]
ansible = ["ansible-core==2.21.5", "ansible-lint==26.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
